[project]
name = "cellmate"
dynamic = ["version"]
description = "Styled Excel spreadsheets with OpenPyXL, in a few lines of Python."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gustavo Furtado", email = "gustavofurtado2@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.0,<4.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/GusFurtado/cellmate"
Repository = "https://github.com/GusFurtado/cellmate"
Documentation = "https://www.gustavofurtado.com/cellmate/"
Issues = "https://github.com/GusFurtado/cellmate/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "cellmate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cellmate"]
